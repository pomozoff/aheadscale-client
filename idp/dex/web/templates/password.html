{{ template "header.html" . }}

<div class="nb-card">
    <h1 class="nb-heading" id="as-title">Sign in</h1>
    <div class="as-tabs" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="as-signin" class="as-tab" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="as-signup" class="as-tab" aria-selected="false">Sign up</button>
    </div>
    <div id="as-error" class="nb-error" role="alert" hidden></div>
    <p id="as-registration-status" class="as-note" role="status" hidden></p>
    <p class="nb-subheading">Enter your credentials</p>

    <form method="post" action="{{ .PostURL }}">
        {{ if .Invalid }}
        <div class="nb-error">
            Invalid {{ .UsernamePrompt }} or password.
        </div>
        {{ end }}

        <div class="nb-form-group">
            <label class="nb-label" for="login">{{ .UsernamePrompt }}</label>
            <input
                type="email"
                id="login"
                name="login"
                class="nb-input"
                autocomplete="username"
                maxlength="254"
                pattern="[^\s@]+@[^\s@.]+(?:\.[^\s@.]+)+"
                placeholder="Enter your {{ .UsernamePrompt | lower }}"
                {{ if .Username }}value="{{ .Username }}"{{ else }}autofocus{{ end }}
                required
            >
        </div>

        <div class="nb-form-group" id="as-password-group">
            <label class="nb-label" for="password">Password</label>
            <div class="as-password-field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="nb-input"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    {{ if .Invalid }}autofocus{{ end }}
                    required
                >
                <button type="button" id="as-password-toggle" class="as-password-toggle"
                    aria-controls="password" aria-label="Show password" aria-pressed="false"
                    title="Show password" hidden>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                        <path class="as-password-strike" d="m3 3 18 18"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" id="submit-login" class="nb-btn" disabled>
            Sign in
        </button>
    </form>

    {{ if .BackLink }}
    <div class="nb-back-link">
        <a href="{{ .BackLink }}" class="nb-link">Choose another login method</a>
    </div>
    {{ end }}
</div>

<script src="{{ url .ReqPath "static/aheadscale-signup.js" }}" defer></script>

{{ template "footer.html" . }}
