name: Aheadscale diagnostic concurrency
on:
  push:
    branches: [codex/diagnostic-nonblocking]
  workflow_dispatch:
    inputs:
      suite:
        description: Объём проверки
        type: choice
        options: [regression, packages]
        default: regression
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
      - name: Форматирование
        run: gofmt -w client/server/debug_concurrency_test.go
      - name: Регрессия блокировки и race
        env:
          TEST_SUITE: ${{ inputs.suite || 'regression' }}
          DBUS_SYSTEM_BUS_ADDRESS: unix:path=/tmp/aheadscale-ci-no-system-bus
        run: |
          if [ "$TEST_SUITE" = packages ]; then
            go test -race -tags devcert -count=1 -timeout 15m ./client/server ./client/internal/debug
          else
            go test -race -tags devcert -count=1 -timeout 5m ./client/server -run '^TestDebugBundleDoesNotBlockControlRPCs$' -v
          fi
      - name: Сводка
        if: always()
        run: |
          printf '### AHEAD-66\n\nSource: `%s`\nSuite: `%s`\nResult: `%s`\n' "$GITHUB_SHA" '${{ inputs.suite || 'regression' }}' '${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: diagnostic-formatted-test
          path: client/server/debug_concurrency_test.go
          retention-days: 3
