name: Aheadscale Linux window reopen
on:
  push:
    branches: ["codex/linux-window-reopen"]
    paths:
      - "client/ui/signal*.go"
      - "client/ui/window_reopen_linux_test.go"
      - ".github/workflows/aheadscale-linux-window.yml"
  workflow_dispatch:
    inputs:
      build_ui:
        type: boolean
        default: false
        description: Собрать настоящий Linux UI для нативной проверки
permissions:
  contents: read
jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
      - name: Установить только SDK Linux UI и изолированный дисплей
        run: |
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev xvfb dbus-x11
      - name: Подготовить assets только для конфигурационных unit-тестов
        run: |
          mkdir -p client/ui/frontend/dist
          printf '<!doctype html><title>Unit fixture</title>' > client/ui/frontend/dist/index.html
          gofmt -w client/ui/window_reopen_linux_test.go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-window-formatted
          path: client/ui/window_reopen_linux_test.go
          retention-days: 1
      - name: Проверить Linux signal policy и штатный callback
        id: tests
        env:
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          CGO_ENABLED=1 dbus-run-session -- xvfb-run -a go test -count=1 -v ./client/ui -run '^(TestLinuxWindowReopenDoesNotClaimWebKitSignal|TestSecondInstanceUsesExistingWindowCallback|TestApplicationErrorsReachClientLog)$' 2>&1 | tee "$RUNNER_TEMP/window-tests.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: github.event_name == 'workflow_dispatch' && inputs.build_ui
        with:
          node-version: '24.19.0'
      - name: Собрать реальный frontend и Linux UI
        if: github.event_name == 'workflow_dispatch' && inputs.build_ui
        run: |
          set -euo pipefail
          npm install --global pnpm@11.4.0
          CC=cc CXX=c++ go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3
          export VITE_AHEADSCALE_MANAGEMENT_URL=https://aheadscale.ru:443
          (cd client/ui && wails3 generate bindings -clean=true -ts)
          pnpm --dir client/ui/frontend install --frozen-lockfile
          pnpm --dir client/ui/frontend build
          mkdir -p ui-artifact
          flags='-s -w -X github.com/netbirdio/netbird/version.version=0.80.0-aheadscale.42-window.1 -X github.com/netbirdio/netbird/client/internal/profilemanager.DefaultManagementURL=https://aheadscale.ru:443 -X github.com/netbirdio/netbird/client/internal/profilemanager.DefaultAdminURL=https://aheadscale.ru:443 -X github.com/netbirdio/netbird/client/internal/profilemanager.LockedServerOrigin=https://aheadscale.ru:443'
          CGO_ENABLED=1 go build -trimpath -tags production -ldflags "$flags" -o ui-artifact/aheadscale-ui ./client/ui
          git rev-parse HEAD > ui-artifact/source.txt
          (cd ui-artifact && sha256sum aheadscale-ui source.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'workflow_dispatch' && inputs.build_ui
        with:
          name: aheadscale-linux-amd64-window-reopen
          path: ui-artifact/
          retention-days: 3
      - name: Сводка
        if: always()
        run: |
          {
            echo '## AHEAD-68: Linux window reopen'
            echo 'Result: ${{ steps.tests.outcome }}'
            tail -15 "$RUNNER_TEMP/window-tests.log" 2>/dev/null || true
            echo 'Unit fixture не поставляется пользователям. Реальное открытие окна проверяется на установленной сборке отдельно.'
          } >> "$GITHUB_STEP_SUMMARY"
