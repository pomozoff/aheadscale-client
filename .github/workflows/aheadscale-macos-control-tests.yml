name: Aheadscale macOS control cancellation
on:
  push:
    branches: ["codex/macos-developer-id"]
    paths:
      - "native/macos/Sources/AheadscaleActivation/VPNControlTermination.swift"
      - "native/macos/Tests/AheadscaleActivationTests/ControlTerminationTests.swift"
      - ".github/workflows/aheadscale-macos-control-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation:
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: swift test --package-path native/macos --filter ControlTerminationTests
