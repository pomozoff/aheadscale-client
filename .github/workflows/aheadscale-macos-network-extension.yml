name: Aheadscale macOS Network Extension
on:
  push:
    branches: ["codex/macos-developer-id"]
    paths:
      - "native/macos/**"
      - "packaging/aheadscale/macos-network-extension/**"
      - ".github/workflows/aheadscale-macos-network-extension.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - name: Проверить provider без сетевых изменений
        run: swift test --package-path native/macos
      - name: Собрать отдельный ARM64 SYSX-прототип
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          swift build --package-path native/macos -c release --arch arm64
          executable_dir=$(swift build --package-path native/macos -c release --arch arm64 --show-bin-path)
          bundle="$RUNNER_TEMP/ne-prototype/ru.aheadscale.client.tunnel.systemextension"
          mkdir -p "$bundle/Contents/MacOS"
          cp "$executable_dir/AheadscaleTunnelExtension" "$bundle/Contents/MacOS/"
          cp packaging/aheadscale/macos-network-extension/Info.plist "$bundle/Contents/"
          plutil -lint "$bundle/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundlePackageType' "$bundle/Contents/Info.plist")" = SYSX
          test "$(/usr/libexec/PlistBuddy -c 'Print NetworkExtension:NEProviderClasses:com.apple.networkextension.packet-tunnel' "$bundle/Contents/Info.plist")" = AheadscaleTunnel.PacketTunnelProvider
          test -n "$(/usr/libexec/PlistBuddy -c 'Print NSSystemExtensionUsageDescription' "$bundle/Contents/Info.plist")"
          lipo "$bundle/Contents/MacOS/AheadscaleTunnelExtension" -verify_arch arm64
          codesign --force --sign - --entitlements packaging/aheadscale/macos-network-extension/provider.entitlements "$bundle"
          codesign --verify --strict --verbose=2 "$bundle"
          app="$RUNNER_TEMP/ne-prototype/Aheadscale Extension Setup.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Library/SystemExtensions" "$app/Contents/Library/LaunchServices"
          cp "$executable_dir/AheadscaleNativeEngineBridge" "$app/Contents/Library/LaunchServices/"
          bash packaging/aheadscale/macos-network-extension/build-native-engine.sh "$app/Contents/Library/LaunchServices/aheadscale-native"
          lipo "$app/Contents/Library/LaunchServices/aheadscale-native" -verify_arch arm64
          codesign --force --sign - "$app/Contents/Library/LaunchServices/AheadscaleNativeEngineBridge"
          codesign --force --sign - "$app/Contents/Library/LaunchServices/aheadscale-native"
          cp "$executable_dir/AheadscaleExtensionSetup" "$app/Contents/MacOS/"
          cp packaging/aheadscale/macos-network-extension/app-Info.plist "$app/Contents/Info.plist"
          ditto "$bundle" "$app/Contents/Library/SystemExtensions/ru.aheadscale.client.tunnel.systemextension"
          plutil -lint "$app/Contents/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print NSSystemExtensionUsageDescription' "$app/Contents/Info.plist")"
          codesign --force --sign - --entitlements packaging/aheadscale/macos-network-extension/app.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p ne-artifact
          ditto -c -k --keepParent "$app" ne-artifact/AheadscaleExtensionSetup-UNSIGNED-PROTOTYPE.zip
          ditto -c -k --keepParent "$bundle" ne-artifact/AheadscaleTunnel-UNSIGNED-PROTOTYPE.zip
          cp packaging/aheadscale/macos-network-extension/README.md ne-artifact/
          git rev-parse HEAD > ne-artifact/source.txt
          (cd ne-artifact && shasum -a 256 *-UNSIGNED-PROTOTYPE.zip source.txt > SHA256SUMS)
      - name: Подготовить отдельный bridge probe без запуска сервиса
        run: |
          set -euo pipefail
          executable_dir=$(swift build --package-path native/macos -c release --arch arm64 --show-bin-path)
          mkdir -p bridge-probe-artifact
          cp "$executable_dir/AheadscaleBridgeProbeRunner" bridge-probe-artifact/
          bridge-probe-artifact/AheadscaleBridgeProbeRunner --self-check > bridge-probe-artifact/self-check.json
          git rev-parse HEAD > bridge-probe-artifact/source.txt
          (cd bridge-probe-artifact && shasum -a 256 AheadscaleBridgeProbeRunner source.txt self-check.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aheadscale-macos-arm64-bridge-probe-UNSIGNED
          path: bridge-probe-artifact/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aheadscale-macos-arm64-ne-UNSIGNED-PROTOTYPE
          path: ne-artifact/
          retention-days: 3
          if-no-files-found: error
      - name: Сохранить stack trace при падении XCTest
        if: failure()
        run: |
          mkdir -p crash-reports
          test_bundle="$(swift build --package-path native/macos --show-bin-path)/AheadscaleNetworkExtensionPackageTests.xctest"
          xcrun lldb --batch -o run -o 'thread backtrace all' -- "$(xcrun -f xctest)" -XCTest 'AheadscaleTunnelTests.PacketTunnelProviderTests/testStopWithoutSessionCompletes' "$test_bundle" > crash-reports/lldb.txt 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name '*xctest*' -o -name '*AheadscaleNetworkExtension*' \) -exec cp {} crash-reports/ \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: aheadscale-macos-xctest-crash
          path: crash-reports/
          retention-days: 1
          if-no-files-found: ignore
      - name: Сводка
        if: always()
        run: |
          printf '### macOS System Extension prototype\n\nCommit: `%s`\nResult: `%s`. Тесты не активируют VPN; подпись Developer ID и native-приёмка выполняются отдельно.\n' "$GITHUB_SHA" '${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
