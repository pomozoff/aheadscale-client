name: Aheadscale desktop previews
on:
  push:
    branches: [aheadscale, 'codex/**']
  pull_request:
    branches: [aheadscale]
  workflow_dispatch:
    inputs:
      targets:
        description: Платформы сборки (macos-arm64 — только macOS ARM64)
        type: choice
        required: true
        default: current
        options: [current, arm64, linux-amd64, linux-arm64, macos-arm64]
permissions:
  contents: read
concurrency:
  group: aheadscale-${{ github.workflow }}-${{ github.ref }}-${{ inputs.targets || 'current' }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
      - name: Client configuration and identity tests
        run: go test ./client/cmd ./client/status ./client/internal/auth ./client/internal/templates ./client/internal/profilemanager ./client/internal/daemonaddr ./client/internal/selfroute ./client/internal/ipcauth ./client/net ./client/internal/routemanager/systemops ./client/configs -count=1
      - name: Проверки DNS и остановки Linux-клиента
        env:
          DBUS_SYSTEM_BUS_ADDRESS: unix:path=/tmp/aheadscale-unit-no-system-bus
        run: go test -race -tags devcert ./client/internal/dns ./client/internal
      - name: Preview updater policy
        run: go test ./client/internal/updater -run TestAheadscale -count=1
      - name: Регрессия завершения GUI при обновлении macOS
        run: go test -race ./packaging/aheadscale
      - name: Package source checks
        run: |
          python3 -m py_compile packaging/aheadscale/package.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/aheadscale -p 'test_*.py' -v
          bash -n packaging/aheadscale/build.sh packaging/aheadscale/scripts/macos-preinstall packaging/aheadscale/scripts/macos-postinstall packaging/aheadscale/scripts/macos-uninstall.command
          sh -n packaging/aheadscale/scripts/postinst packaging/aheadscale/scripts/prerm packaging/aheadscale/scripts/cleanup-networkmanager
          git diff --check
  windows-identity:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
      - name: Independent Windows adapter identity
        run: go test ./client/iface/device -run TestAheadscale -count=1
  build:
    needs: [unit, windows-identity]
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.targets == 'linux-amd64' &&
          '[{"platform":"linux","arch":"amd64","runner":"ubuntu-24.04"}]' || inputs.targets == 'macos-arm64' &&
          '[{"platform":"darwin","arch":"arm64","runner":"macos-26"}]' || inputs.targets == 'linux-arm64' &&
          '[{"platform":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"}]' || inputs.targets == 'arm64' &&
          '[{"platform":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},
          {"platform":"windows","arch":"arm64","runner":"ubuntu-24.04"}]' ||
          '[{"platform":"linux","arch":"amd64","runner":"ubuntu-24.04"},
          {"platform":"windows","arch":"amd64","runner":"ubuntu-24.04"},
          {"platform":"darwin","arch":"arm64","runner":"macos-26"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Install pinned pnpm
        run: |
          npm install --global pnpm@11.4.0
          test "$(pnpm --version)" = '11.4.0'
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
          if [[ '${{ matrix.platform }}' == windows ]]; then
            sudo apt-get install -y nsis p7zip-full
            if [[ '${{ matrix.arch }}' == amd64 ]]; then
              sudo apt-get install -y gcc-mingw-w64-x86-64
            fi
          fi
      - name: Windows native dependencies
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, zipfile, subprocess
          files = [
            ('https://pkgs.netbird.io/wintun/wintun-0.14.1.zip', 'wintun.zip', '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'),
            ('https://pkgs.netbird.io/nsis/EnVar_plugin.zip', 'envar.zip', 'e9aa92de351345ed82795251d838f1ae9041ba35af9d381a5780c7843b01f56a'),
            ('https://pkgs.netbird.io/nsis/ShellExecAsUser_amd64-Unicode.7z', 'shell.7z', '0a55ea25c7330a92cec028eda8afcaf1b1a7092e0dfb77c21c8f654564b4ff9d')]
          work=Path('/tmp/aheadscale-deps'); work.mkdir()
          for url,name,digest in files:
              target=work/name; urllib.request.urlretrieve(url,target)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest, name+' checksum mismatch'
              if name.endswith('.zip'):
                  with zipfile.ZipFile(target) as archive: archive.extractall(work)
              else: subprocess.run(['7z','x',str(target),'-o'+str(work)],check=True)
          for dll in work.rglob('*.dll'):
              if 'Plugins' in dll.parts and 'x86-unicode' in dll.parts:
                  subprocess.run(['sudo','cp',str(dll),'/usr/share/nsis/Plugins/x86-unicode/'],check=True)
          PY
          if [[ '${{ matrix.arch }}' == arm64 ]]; then
            curl --fail --location --retry 3 -o /tmp/llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20250709/llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz
            echo '60cafae6474c7411174cff1d4ba21a8e46cadbaeb05a1bace306add301628337  /tmp/llvm-mingw.tar.xz' | sha256sum -c
            tar -xf /tmp/llvm-mingw.tar.xz -C /tmp
            echo '/tmp/llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64/bin' >> "$GITHUB_PATH"
            echo 'CC=aarch64-w64-mingw32-clang' >> "$GITHUB_ENV"
            echo 'CXX=aarch64-w64-mingw32-clang++' >> "$GITHUB_ENV"
          else
            echo 'CC=x86_64-w64-mingw32-gcc' >> "$GITHUB_ENV"
          fi
      - name: Проверка kernel-path GUI на macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/sleep 120 &
          verifier_pid=$!
          trap 'kill "$verifier_pid" 2>/dev/null || true; wait "$verifier_pid" 2>/dev/null || true' EXIT
          test "$(/usr/bin/osascript -l JavaScript packaging/aheadscale/scripts/macos-gui-process.js "$verifier_pid" /bin/sleep)" = match
          test "$(/usr/bin/osascript -l JavaScript packaging/aheadscale/scripts/macos-gui-process.js "$verifier_pid" /bin/false)" = other
      - name: Install pinned binding generator
        run: CC=cc CXX=c++ go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3
      - name: Build private and public-endpoint previews
        shell: bash
        run: |
          for channel in internal public; do
            if [[ '${{ matrix.platform }}' == windows ]]; then
              mkdir -p 'build/windows-${{ matrix.arch }}-'"$channel"
              cp '/tmp/aheadscale-deps/wintun/bin/${{ matrix.arch }}/wintun.dll' 'build/windows-${{ matrix.arch }}-'"$channel/"
              cp /tmp/aheadscale-deps/wintun/LICENSE.txt 'build/windows-${{ matrix.arch }}-'"$channel/WINTUN-LICENSE.txt"
              wails3 generate webview2bootstrapper
              mv MicrosoftEdgeWebview2Setup.exe 'build/windows-${{ matrix.arch }}-'"$channel/"
            fi
            bash packaging/aheadscale/build.sh '${{ matrix.platform }}' '${{ matrix.arch }}' "$channel"
          done
      - name: Локальный IPv4 macOS и восстановление маршрута RG40
        if: matrix.platform == 'darwin'
        run: |
          go test -race ./client/internal/selfroute -count=1
          go test -tags privileged -c -o "$RUNNER_TEMP/aheadscale-selfroute.test" ./client/internal/selfroute
          sudo "$RUNNER_TEMP/aheadscale-selfroute.test" -test.v -test.run TestDarwinLocalRouteLifecycle -test.timeout 30s
          rm "$RUNNER_TEMP/aheadscale-selfroute.test"
      - name: Native UI service tests
        if: matrix.platform == 'linux'
        run: CGO_ENABLED=1 go test -timeout 5m ./client/ui/authsession/... ./client/ui/i18n/... ./client/ui/preferences/... ./client/ui/services/...
      - name: Нативные RPM desktop и CLI
        if: matrix.platform == 'linux'
        env:
          AHEADSCALE_RPM_ARCH: ${{ matrix.arch }}
        run: |
          docker build --iidfile /tmp/aheadscale-rpm-image -f packaging/aheadscale/Dockerfile.rpm packaging/aheadscale
          export AHEADSCALE_RPM_IMAGE=$(cat /tmp/aheadscale-rpm-image)
          tools=$(mktemp -d)
          trap 'rm -rf "$tools"' EXIT
          for tool in rpm rpmbuild; do
            ln -s "$PWD/packaging/aheadscale/scripts/rpm-tool.sh" "$tools/$tool"
          done
          export RPMBUILD="$tools/rpmbuild" RPM="$tools/rpm"
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          for channel in internal public; do
            export AHEADSCALE_RPM_CHANNEL=$channel
            python3 packaging/aheadscale/package.py --platform linux --arch "$AHEADSCALE_RPM_ARCH" --channel "$channel" --format rpm
            python3 packaging/aheadscale/package.py --platform linux --arch "$AHEADSCALE_RPM_ARCH" --channel "$channel" --format rpm --cli-only
          done
      - name: Linux preview installation and removal
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./dist/aheadscale_*_linux_${{ matrix.arch }}_internal.deb
          sudo systemctl is-active --quiet aheadscale
          aheadscale status
          sudo apt-get remove -y aheadscale
          test ! -f /etc/systemd/system/aheadscale.service
          test ! -x /usr/bin/aheadscale
      - name: Манифест всех установщиков
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          outputs = sorted(p for p in Path('dist').iterdir() if p.is_file())
          files = [{"name": p.name, "sha256": hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(), "size": p.stat().st_size} for p in outputs]
          Path('dist/SHA256SUMS').write_text(''.join(f['sha256']+'  '+f['name']+'\n' for f in files))
          manifest = {"sourceCommit": subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), "clientVersion": Path('packaging/aheadscale/version.txt').read_text().strip(), "platform": "${{ matrix.platform }}", "architecture": "${{ matrix.arch }}", "files": files}
          Path('dist/build-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY
      - name: Save test installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aheadscale-${{ matrix.platform }}-${{ matrix.arch }}-UNSIGNED-PREVIEW
          path: dist/*
          if-no-files-found: error
          retention-days: 7
# No releases, CDN upload, signing secrets or production environment in preview CI.
# Publisher signing and the independently verified backend gates must be added
# before a separate protected release workflow is enabled.
