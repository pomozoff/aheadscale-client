name: Aheadscale Windows VPN prototype
on:
  push:
    branches: [codex/windows-vpn-prototype]
    paths: ['packaging/windows-vpn-prototype/**', '.github/workflows/aheadscale-windows-vpn-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Собрать и подписать отдельный опытный ARM64-пакет
        shell: pwsh
        run: ./packaging/windows-vpn-prototype/scripts/build.ps1 -Architecture arm64 -SdkVersion 10.0.26100.0 -Version '0.1.${{ github.run_number }}.${{ github.run_attempt }}'
      - name: Сохранить опытный пакет без закрытого ключа
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aheadscale-windows-vpn-arm64-PROTOTYPE
          path: packaging/windows-vpn-prototype/out/dist/
          if-no-files-found: error
