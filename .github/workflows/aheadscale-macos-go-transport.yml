name: Aheadscale macOS Go transport
on:
  push:
    branches: ["codex/macos-developer-id"]
    paths:
      - "client/internal/macosvpn/**"
      - "client/iface/*native*darwin.go"
      - "client/iface/device/*native*darwin.go"
      - ".github/workflows/aheadscale-macos-go-transport.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-transport:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - name: Форматировать Go-исходники адаптера
        run: gofmt -w client/internal/macosvpn/*.go client/internal/macosvpn/handoffcheck/*.go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-go-transport-formatted
          path: |
            client/internal/macosvpn/*.go
            client/internal/macosvpn/handoffcheck/*.go
          retention-days: 1
      - name: Проверить Go-адаптер канала без изменения сети
        id: transport
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./client/internal/macosvpn 2>&1 | tee "$RUNNER_TEMP/go-transport.log"
      - name: Сохранить прежний канал системного отключения
        run: go test -tags macosvpnprototype -run '^TestDisconnectSignalPreservesSystemIntegration$' ./client/internal
      - name: Форматировать интеграцию движка
        run: |
          gofmt -w client/iface/iface.go client/iface/iface_new_darwin.go client/iface/iface_new_native_darwin.go client/iface/device/device_native_darwin.go client/internal/engine.go client/internal/connect.go client/internal/native_macos_*.go client/internal/wg_iface_lifecycle_standard.go client/internal/wg_iface_lifecycle_native_darwin.go client/internal/routemanager/systemops/native_vpn_other.go client/internal/routemanager/systemops/native_vpn_darwin.go client/internal/routemanager/systemops/systemops_darwin.go client/internal/stdnet/native_vpn_other.go client/internal/stdnet/native_vpn_darwin.go client/server/startup_standard.go client/server/startup_native_darwin.go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-native-engine-formatted
          path: |
            client/iface/iface.go
            client/iface/iface_new_darwin.go
            client/iface/iface_new_native_darwin.go
            client/iface/device/device_native_darwin.go
            client/internal/engine.go
            client/internal/connect.go
            client/internal/native_macos_*.go
            client/internal/wg_iface_lifecycle_standard.go
            client/internal/wg_iface_lifecycle_native_darwin.go
            client/internal/routemanager/systemops/native_vpn_other.go
            client/internal/routemanager/systemops/native_vpn_darwin.go
            client/internal/routemanager/systemops/systemops_darwin.go
            client/internal/stdnet/native_vpn_other.go
            client/internal/stdnet/native_vpn_darwin.go
            client/server/startup_standard.go
            client/server/startup_native_darwin.go
          retention-days: 1
      - name: Собрать настоящий daemon с нативным адаптером
        run: |
          set -euo pipefail
          mkdir -p native-engine-artifact
          bash packaging/aheadscale/macos-network-extension/build-native-engine.sh "$PWD/native-engine-artifact/aheadscale-native"
          go build -o "$RUNNER_TEMP/aheadscale-legacy" ./client
          git rev-parse HEAD > native-engine-artifact/source.txt
          shasum -a 256 native-engine-artifact/aheadscale-native > native-engine-artifact/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-native-engine
          path: native-engine-artifact/
          retention-days: 3
      - name: Итог целевой проверки
        if: always()
        env:
          RESULT: ${{ steps.transport.outcome }}
        run: |
          {
            echo "## macOS: Go packet transport"
            echo "Результат: $RESULT"
            echo '```text'
            tail -25 "$RUNNER_TEMP/go-transport.log" 2>/dev/null || true
            echo '```'
            echo "Проверяются адаптер, настоящий WireGuard duplex, MTU, Close, idle и timeout."
            echo "Установленное Network Extension и рабочий daemon этим job не запускаются."
          } >> "$GITHUB_STEP_SUMMARY"
